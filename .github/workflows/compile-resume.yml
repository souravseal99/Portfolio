name: Compile LaTeX Resume to PDF

on:
  push:
    paths:
      - 'SouravSeal_Resume.tex'
      - '.github/workflows/compile-resume.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: SouravSeal_Resume.tex

      - name: Move PDF to public directory
        run: |
          mkdir -p public
          mv SouravSeal_Resume.pdf public/Sourav_s_resume.pdf

      - name: Commit updated PDF
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update compiled resume PDF [skip ci]"
          file_pattern: 'public/Sourav_s_resume.pdf'
